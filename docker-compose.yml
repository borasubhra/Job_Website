services:
  db:
    image: postgres:16-alpine
    container_name: jobportal_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - jobportal_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Website: PHP 8.5 + Apache
  web:
    build: { context: ., dockerfile: docker/php/Dockerfile }
    image: jobportal-php
    container_name: jobportal_web
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./app:/var/www/app          # edit code on Windows, changes show immediately
      - ./db:/var/www/db:ro
    depends_on:
      db: { condition: service_healthy }

  # Automatic job updates (runs bin/scheduler.php forever)
  scheduler:
    image: jobportal-php
    container_name: jobportal_scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    command: ["php", "/var/www/app/bin/scheduler.php"]
    volumes:
      - ./app:/var/www/app
      - ./db:/var/www/db:ro
    depends_on:
      db: { condition: service_healthy }
      web: { condition: service_started }

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: jobportal_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      db: { condition: service_healthy }

volumes:
  jobportal_data:
